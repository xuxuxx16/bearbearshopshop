<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐻 小熊盐饭堂・工具箱</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: linear-gradient(150deg, #edf5ff 0%, #fff0f3 55%, #eaf4fe 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(120deg, #2b6fd8, #ff6b8b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { font-size: 12px; color: #888; margin-bottom: 30px; }
    .tool-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      max-width: 420px;
    }
    .tool-card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 20px;
      padding: 28px 16px;
      text-align: center;
      text-decoration: none;
      color: #233142;
      box-shadow: 0 6px 24px rgba(94, 158, 255, 0.12);
      transition: all 0.2s;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.9);
    }
    .tool-card:active { transform: scale(0.97); }
    .tool-icon { font-size: 40px; margin-bottom: 12px; }
    .tool-name { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .tool-desc { font-size: 10px; color: #888; line-height: 1.4; }
    .footer { margin-top: 30px; font-size: 10px; color: #bbb; }
  </style>
</head>
<body>
  <h1>🐻🍚 小熊盐饭堂</h1>
  <div class="subtitle">私人专属工具箱</div>
  <div class="tool-grid">
    <a class="tool-card" href=" ">
      <div class="tool-icon">📋</div>
      <div class="tool-name">发货管理台</div>
      <div class="tool-desc">导入商品 · 标价<br>打勾发货 · 按天存档</div>
    </a >
    <a class="tool-card" href="pintu.html">
      <div class="tool-icon">🖼️</div>
      <div class="tool-name">拼图工坊</div>
      <div class="tool-desc">九宫格排版 · 编号<br>水印 · 无损导出</div>
    </a >
  </div>
  <div class="footer">🔒 所有数据仅存于本地浏览器 · 不上传任何云端</div>
</body>
</html>
