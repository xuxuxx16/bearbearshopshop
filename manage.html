<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐻 小熊盐饭堂・发货管理台 V3.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: linear-gradient(150deg, #f0f4ff 0%, #fff0f3 50%, #eef6ff 100%);
      color: #233142; padding: 12px; padding-bottom: 120px; min-height: 100vh;
    }
    .header { text-align: center; margin-bottom: 14px; }
    .header h1 { font-size: 19px; font-weight: 700; background: linear-gradient(120deg, #2b6fd8, #ff6b8b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header p { font-size: 11px; color: #888; margin-top: 3px; }
    .top-bar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .btn-top { flex: 1; min-width: 70px; padding: 10px 6px; border: none; border-radius: 10px; font-size: 11px; font-weight: 600; cursor: pointer; color: white; text-align: center; }
    .btn-archive { background: linear-gradient(130deg, #6c5ce7, #a29bfe); }
    .btn-history { background: linear-gradient(130deg, #0984e3, #74b9ff); }
    .btn-report { background: linear-gradient(130deg, #2ed573, #10ac84); }
    .btn-new { background: linear-gradient(130deg, #fdcb6e, #e17055); }
    .upload-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: stretch; }
    .upload-area { flex: 1; border: 2px dashed rgba(94,158,255,0.4); border-radius: 14px; padding: 12px; text-align: center; background: rgba(255,255,255,0.8); cursor: pointer; }
    .start-num-box { background: white; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); min-width: 85px; }
    .start-num-box label { font-size: 10px; color: #888; margin-bottom: 3px; }
    .start-num-box input { width: 55px; text-align: center; font-size: 18px; font-weight: 800; color: #2b6fd8; border: 2px solid #dde8ff; border-radius: 10px; padding: 5px; outline: none; }
    input[type="file"] { display: none; }
    .alert-bar { background: #fff3cd; border: 1px solid #ffc107; border-radius: 10px; padding: 10px; margin-bottom: 10px; font-size: 12px; color: #856404; display: none; }
    .alert-bar.show { display: block; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .item-card { background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.06); border: 3px solid transparent; transition: all 0.2s; }
    .item-card.sold { border-color: #2ed573; }
    .item-card.sold .sold-badge { display: flex; }
    .item-img-wrap { width: 100%; aspect-ratio: 3/4; overflow: hidden; position: relative; background: #f0f4ff; }
    .item-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sold-badge { display: none; position: absolute; top: 6px; right: 6px; background: #2ed573; color: white; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 16px; box-shadow: 0 2px 6px rgba(46,213,115,0.4); }
    .item-num { position: absolute; top: 6px; left: 6px; background: rgba(35,49,66,0.8); color: white; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 16px; cursor: pointer; }
    .item-info { padding: 8px 10px; }
    .price-row { margin-bottom: 6px; }
    .price-row select { width: 100%; padding: 5px 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; font-weight: 600; color: #e67e22; background: #fffaf0; outline: none; }
    .check-row { display: flex; flex-direction: column; gap: 4px; }
    .check-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; color: #555; }
    .check-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: #2ed573; cursor: pointer; }
    .check-item.done { color: #2ed573; font-weight: 700; }
    .stats-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.97); backdrop-filter: blur(12px); padding: 10px 14px 20px 14px; box-shadow: 0 -4px 16px rgba(0,0,0,0.08); z-index: 100; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
    .stat-box { background: #f8f9fa; border-radius: 8px; padding: 6px 4px; }
    .stat-num { font-size: 17px; font-weight: 800; color: #2b6fd8; }
    .stat-label { font-size: 9px; color: #888; margin-top: 1px; }
    .stat-box.income .stat-num { color: #2ed573; }
    .stat-box.remain .stat-num { color: #e67e22; }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.88); backdrop-filter: blur(10px); z-index: 999; padding: 20px 14px; overflow-y: auto; }
    .modal-box { background: white; border-radius: 18px; padding: 16px; max-width: 500px; margin: 0 auto; max-height: 85vh; overflow-y: auto; }
    .modal-title { font-size: 16px; font-weight: 700; color: #2b6fd8; margin-bottom: 12px; text-align: center; }
    .archive-item { background: #f8f9fa; border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
    .archive-date { font-size: 14px; font-weight: 700; color: #233142; }
    .archive-stats { font-size: 11px; color: #888; margin-top: 2px; }
    .btn-mini { padding: 6px 10px; border: none; border-radius: 8px; font-size: 10px; font-weight: 600; cursor: pointer; color: white; }
    .btn-view { background: #0984e3; }
    .btn-del { background: #e74c3c; }
    .modal-close { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; background: #f8f9fa; font-size: 14px; font-weight: 600; color: #555; cursor: pointer; margin-top: 10px; text-align: center; }
    .empty-msg { text-align: center; color: #aaa; padding: 30px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🐻🍚 小熊盐饭堂・发货管理台</h1>
    <p>导入 → 标价 → 打勾管理 → 存档 → 历史回看</p >
  </div>
  <div class="top-bar">
    <button class="btn-top btn-archive" onclick="archiveToday()">💾 存档今日</button>
    <button class="btn-top btn-history" onclick="openHistory()">📂 历史档案</button>
    <button class="btn-top btn-report" onclick="exportStats()">📊 战报</button>
    <button class="btn-top btn-new" onclick="newSession()">🆕 新一期</button>
  </div>
  <div class="upload-row">
    <div class="upload-area" onclick="document.getElementById('imgInput').click()">
      <div style="font-size: 20px;">📦</div>
      <div style="font-size: 12px; color: #2b6fd8; font-weight: 600;" id="uploadText">点击导入本批图片</div>
      <div style="font-size: 9px; color: #aaa; margin-top: 2px;">支持多选 · 可分批导入</div>
    </div>
    <div class="start-num-box">
      <label>起始编号</label>
      <input type="number" id="startNumInput" value="1" min="1">
      <div style="font-size: 8px; color: #aaa; margin-top: 2px;">下批自动递增</div>
    </div>
  </div>
  <input type="file" id="imgInput" multiple accept="image/*">
  <div class="alert-bar" id="unshippedAlert">⚠️ <b>有未发货订单！</b> <span id="unshippedDetail"></span></div>
  <div class="grid" id="itemGrid"></div>
  <div class="stats-bar">
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-num" id="statTotal">0</div><div class="stat-label">总商品</div></div>
      <div class="stat-box"><div class="stat-num" id="statSold">0</div><div class="stat-label">已售出</div></div>
      <div class="stat-box income"><div class="stat-num" id="statIncome">0🥕</div><div class="stat-label">已收款</div></div>
      <div class="stat-box remain"><div class="stat-num" id="statRemain">0</div><div class="stat-label">剩余</div></div>
    </div>
  </div>
  <div class="modal" id="historyModal">
    <div class="modal-box">
      <div class="modal-title">📂 历史存档列表</div>
      <div id="archiveList"></div>
      <button class="modal-close" onclick="closeHistory()">返回当前工作台</button>
    </div>
  </div>
  <div class="modal" id="detailModal">
    <div class="modal-box">
      <div class="modal-title" id="detailTitle">📋 存档详情</div>
      <div id="detailContent" style="font-size: 13px; line-height: 1.8; white-space: pre-wrap; color: #333;"></div>
      <button class="modal-close" onclick="closeDetail()">关闭</button>
    </div>
  </div><script>
    let items = [];
    const imgInput = document.getElementById('imgInput');
    const itemGrid = document.getElementById('itemGrid');

    window.addEventListener('load', () => {
      const saved = localStorage.getItem('bear_current_v3');
      if (saved) {
        try {
          items = JSON.parse(saved);
          renderAll();
          if (items.length > 0) {
            const maxNum = Math.max(...items.map(i => i.num));
            document.getElementById('startNumInput').value = maxNum + 1;
          }
        } catch(e) {}
      }
      window._cachedArchives = JSON.parse(localStorage.getItem('bear_archives_v3') || '[]');
    });

    imgInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;
      let startNum = parseInt(document.getElementById('startNumInput').value) || 1;
      for (let i = 0; i < files.length; i++) {
        const dataUrl = await readFile(files[i]);
        items.push({ id: Date.now() + '_' + i, imgData: dataUrl, num: startNum + i, price: 4, sold: false, paid: false, shipped: false });
      }
      document.getElementById('startNumInput').value = startNum + files.length;
      document.getElementById('uploadText').innerText = `已载入 ${items.length} 件商品`;
      renderAll(); saveData();
    });

    function readFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.readAsDataURL(file);
      });
    }

    function renderAll() {
      itemGrid.innerHTML = '';
      items.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = `item-card ${item.sold ? 'sold' : ''}`;
        const numDisplay = String(item.num).padStart(2, '0');
        card.innerHTML = `
          <div class="item-img-wrap">
            < img src="${item.imgData}" alt="${numDisplay}">
            <div class="item-num" onclick="editNum(${idx})">${numDisplay}</div>
            <div class="sold-badge">✅ 已售</div>
          </div>
          <div class="item-info">
            <div class="price-row">
              <select onchange="updatePrice(${idx}, this.value)">
                <option value="4" ${item.price==4?'selected':''}>4🥕 竖图</option>
                <option value="5" ${item.price==5?'selected':''}>5🥕 横图</option>
                <option value="7" ${item.price==7?'selected':''}>7🥕 带视频</option>
                <option value="10" ${item.price==10?'selected':''}>10🥕 拦截</option>
              </select>
            </div>
            <div class="check-row">
              <label class="check-item ${item.sold?'done':''}"><input type="checkbox" ${item.sold?'checked':''} onchange="toggleSold(${idx},this.checked)">${item.sold?'✅ 已售出':'待售中'}</label>
              <label class="check-item ${item.paid?'done':''}"><input type="checkbox" ${item.paid?'checked':''} onchange="togglePaid(${idx},this.checked)">${item.paid?'💰 已收款':'未收款'}</label>
              <label class="check-item ${item.shipped?'done':''}"><input type="checkbox" ${item.shipped?'checked':''} onchange="toggleShipped(${idx},this.checked)">${item.shipped?'📮 已发货':'未发货'}</label>
            </div>
          </div>`;
        itemGrid.appendChild(card);
      });
      updateStats(); checkUnshipped();
    }

    function editNum(idx) {
      const n = prompt('输入新编号（与拼图上一致）：', items[idx].num);
      if (n !== null && !isNaN(parseInt(n))) { items[idx].num = parseInt(n); renderAll(); saveData(); }
    }
    function updatePrice(idx, val) { items[idx].price = parseInt(val); saveData(); updateStats(); }
    function toggleSold(idx, c) { items[idx].sold = c; if(!c){items[idx].paid=false;items[idx].shipped=false;} renderAll(); saveData(); }
    function togglePaid(idx, c) { items[idx].paid = c; if(c) items[idx].sold=true; renderAll(); saveData(); }
    function toggleShipped(idx, c) { items[idx].shipped = c; if(c){items[idx].sold=true;items[idx].paid=true;} renderAll(); saveData(); }

    function checkUnshipped() {
      const unshipped = items.filter(i => i.paid && !i.shipped);
      const el = document.getElementById('unshippedAlert');
      if (unshipped.length > 0) {
        document.getElementById('unshippedDetail').innerText = `编号 ${unshipped.map(i=>'#'+String(i.num).padStart(2,'0')).join('、')} 已收款未发货！`;
        el.classList.add('show');
      } else { el.classList.remove('show'); }
    }

    function updateStats() {
      const t = items.length, s = items.filter(i=>i.sold), p = items.filter(i=>i.paid);
      const income = p.reduce((a,i)=>a+i.price, 0);
      document.getElementById('statTotal').innerText = t;
      document.getElementById('statSold').innerText = s.length;
      document.getElementById('statIncome').innerText = income + '🥕';
      document.getElementById('statRemain').innerText = t - s.length;
    }

    function saveData() {
      try {
        const saveItems = items.map(item => ({
          id: item.id, num: item.num, price: item.price,
          sold: item.sold, paid: item.paid, shipped: item.shipped
        }));
        localStorage.setItem('bear_current_v3', JSON.stringify(saveItems));
      } catch(e) {}
    }

    function getArchiveList() { return window._cachedArchives || []; }
    function saveArchiveList(list) {
      window._cachedArchives = list;
      localStorage.setItem('bear_archives_v3', JSON.stringify(list));
    }

    function archiveToday() {
      if (items.length === 0) { alert('当前没有商品数据可存档哦！'); return; }
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const soldItems = items.filter(i => i.sold);
      const paidItems = items.filter(i => i.paid);
      const totalIncome = paidItems.reduce((a,i) => a + i.price, 0);
      const archiveData = {
        id: Date.now(), date: dateStr, time: timeStr,
        totalItems: items.length, soldCount: soldItems.length,
        paidCount: paidItems.length, totalIncome: totalIncome,
        details: items.map(i => ({ num: i.num, price: i.price, sold: i.sold, paid: i.paid, shipped: i.shipped }))
      };
      const list = getArchiveList();
      list.unshift(archiveData);
      saveArchiveList(list);
      alert(`✅ 已存档！\n📅 ${dateStr} ${timeStr}\n📦 共 ${items.length} 件 · 售出 ${soldItems.length} 件 · 收入 ${totalIncome}🥕`);
    }

    function newSession() {
      if (items.length > 0) {
        const doArchive = confirm('开始新一期前，要先存档吗？\n\n确定 = 先存档再清空\n取消 = 直接清空');
        if (doArchive) archiveToday();
      }
      items = [];
      localStorage.removeItem('bear_current_v3');
      document.getElementById('startNumInput').value = 1;
      document.getElementById('uploadText').innerText = '点击导入本批图片';
      renderAll();
      alert('🆕 新一期工作台已就绪！');
    }

    function openHistory() {
      const list = getArchiveList();
      const container = document.getElementById('archiveList');
      container.innerHTML = '';
      if (list.length === 0) {
        container.innerHTML = '<div class="empty-msg">📭 还没有存档记录哦~</div>';
      } else {
        list.forEach((arc, idx) => {
          const div = document.createElement('div');
          div.className = 'archive-item';
          div.innerHTML = `
            <div>
              <div class="archive-date">📅 ${arc.date}（${arc.time}）</div>
              <div class="archive-stats">📦${arc.totalItems}件 · ✅售${arc.soldCount}件 · 💰${arc.totalIncome}🥕</div>
            </div>
            <div style="display:flex;gap:6px;">
              <button class="btn-mini btn-view" onclick="viewArchive(${idx})">查看</button>
              <button class="btn-mini btn-del" onclick="deleteArchive(${idx})">删除</button>
            </div>`;
          container.appendChild(div);
        });
      }
      document.getElementById('historyModal').style.display = 'block';
    }

    function closeHistory() { document.getElementById('historyModal').style.display = 'none'; }

    function viewArchive(idx) {
      const list = getArchiveList();
      const arc = list[idx];
      if (!arc) return;
      let text = `📅 日期：${arc.date}（${arc.time}）\n━━━━━━━━━━━━━━━━\n`;
      text += `📦 总商品：${arc.totalItems} 件\n✅ 已售出：${arc.soldCount} 件\n💰 已收款：${arc.paidCount} 笔（共 ${arc.totalIncome}🥕）\n`;
      text += `📈 转化率：${arc.totalItems > 0 ? Math.round(arc.soldCount / arc.totalItems * 100) : 0}%\n━━━━━━━━━━━━━━━━\n\n`;
      const sold = arc.details.filter(d => d.sold);
      const unsold = arc.details.filter(d => !d.sold);
      if (sold.length > 0) {
        text += `✅ 售出明细：\n`;
        sold.forEach(d => { text += `  #${String(d.num).padStart(2,'0')}　${d.price}🥕　${d.paid?'💰已收':'❌未收'}　${d.shipped?'📮已发':'⚠️未发'}\n`; });
      }
      if (unsold.length > 0) {
        text += `\n📦 未售出：\n`;
        unsold.forEach(d => { text += `  #${String(d.num).padStart(2,'0')}　${d.price}🥕\n`; });
      }
      document.getElementById('detailTitle').innerText = `📋 ${arc.date} 存档详情`;
      document.getElementById('detailContent').innerText = text;
      document.getElementById('detailModal').style.display = 'block';
    }

    function closeDetail() { document.getElementById('detailModal').style.display = 'none'; }

    function deleteArchive(idx) {
      if (!confirm('确定要删除这条存档吗？')) return;
      const list = getArchiveList();
      list.splice(idx, 1);
      saveArchiveList(list);
      openHistory();
    }

    function exportStats() {
      const t = items.length, s = items.filter(i=>i.sold), p = items.filter(i=>i.paid);
      const sh = items.filter(i=>i.shipped), income = p.reduce((a,i)=>a+i.price,0);
      const unshipped = items.filter(i=>i.paid&&!i.shipped), unsold = items.filter(i=>!i.sold);
      let r = `🐻🍚 小熊盐饭堂・本期战报\n━━━━━━━━━━━━━━━━\n`;
      r += `📦 总商品：${t} 件\n✅ 已售出：${s.length} 件\n💰 已收款：${p.length} 笔（${income}🥕）\n📮 已发货：${sh.length} 件\n`;
      if (unshipped.length > 0) { r += `\n⚠️ 待发货：\n`; unshipped.forEach(i => { r += `  #${String(i.num).padStart(2,'0')}（${i.price}🥕）\n`; }); }
      if (unsold.length > 0) { r += `\n📦 未售出余量：\n`; unsold.forEach(i => { r += `  #${String(i.num).padStart(2,'0')}（${i.price}🥕）\n`; }); }
      r += `\n━━━━━━━━━━━━━━━━\n💎 总营收：${income}🥕\n📈 转化率：${t>0?Math.round(s.length/t*100):0}%`;
      alert(r);
    }
  </script>
</body>
</html>
